<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="林中路：一个前魔法世界里，关于此在、技术与人工智能的 2D 像素 RPG。手机和电脑都能玩。">
<title>林中路 · Holzwege</title>
<link rel="icon" href="assets/portraits/hero.png">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="cg" class="hidden"><img alt=""></div>
    <div id="titlecard" class="hidden"></div>
    <div id="fade"></div>
    <div id="flash"></div>

    <div id="dlg" class="win hidden">
      <div id="dlg-face" class="hidden"><img alt=""></div>
      <div id="dlg-body">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
      </div>
      <div id="dlg-next">▼</div>
    </div>
    <div id="choice" class="win hidden"></div>
    <div id="toast" class="win hidden"></div>
    <div id="hud" class="hidden"><span id="hud-map"></span></div>
    <button id="menu-btn" class="hidden" aria-label="菜单">☰</button>

    <div id="menu" class="win hidden"></div>
    <div id="goal" class="win hidden"></div>
    <div id="panel" class="win hidden"></div>

    <div id="battle" class="hidden">
      <div id="b-top" class="win"><div id="b-name"></div><div class="bar"><i id="b-hp"></i></div><div id="b-mind-l">心绪</div><div class="bar mind"><i id="b-mind"></i></div></div>
      <div id="b-enemy"><img alt=""></div>
      <div id="b-msg" class="win"></div>
      <div id="b-cmd" class="win hidden"></div>
    </div>

    <div id="title" class="hidden">
      <div id="title-bg"></div>
      <div id="title-box">
        <h1>林中路</h1>
        <p class="sub">Holzwege · 一个前魔法世界的像素物语</p>
        <div id="title-menu"></div>
        <p class="hint key-hint">方向键 / WASD 移动 · Z / 空格 确认 · X / Esc 菜单 · 也可以用鼠标点地面走路</p>
        <p class="hint touch-hint">方向键移动 · A 确认 · B 返回 / 菜单 · 也可以直接点地面走路</p>
      </div>
    </div>

    <div id="namebox" class="win hidden">
      <p>你的名字是？</p>
      <input id="name-input" maxlength="6" value="林恩" autocomplete="off">
      <button id="name-ok">确定</button>
    </div>
    <div id="loadnote" class="hidden">载入中</div>
    <div id="loading">正在走进林子……</div>
  </div>

  <div id="pad">
    <div id="dpad">
      <button data-d="up" class="d up">▲</button>
      <button data-d="left" class="d left">◀</button>
      <button data-d="right" class="d right">▶</button>
      <button data-d="down" class="d down">▼</button>
    </div>
    <div id="abtns">
      <button id="btn-b" class="round">B</button>
      <button id="btn-a" class="round">A</button>
    </div>
  </div>
</div>
<script src="data/maps.js?v=4"></script>
<script src="data/story.js?v=4"></script>
<script src="data/battles.js?v=4"></script>
<script src="data/items.js?v=4"></script>
<script src="data/objectives.js?v=4"></script>
<script src="js/util.js?v=4"></script>
<script src="js/music.js?v=4"></script>
<script src="js/audio.js?v=4"></script>
<script src="js/world.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/script.js?v=4"></script>
<script src="js/battle.js?v=4"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
